name: Playwright Tests

# Tests this site against itself: the static server in scripts/serve.js is
# started by Playwright's webServer. No secrets are needed.

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create the env file for the local server
              run: cp env/.env.example env/.env.dev

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Playwright tests
              run: npm run test:ci

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
